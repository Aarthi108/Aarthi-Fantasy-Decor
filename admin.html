<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin – Aarthi's Fantasy Decor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FBF8F3;color:#3D2A30;font-family:'Jost',system-ui,sans-serif;font-weight:300;line-height:1.5;font-size:15px}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0;line-height:1.2}
button,select,input,textarea{font:inherit;color:inherit}
.hidden{display:none !important}
.top{background:#3D2A30;color:#FBE3E1;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px;color:#FBE3E1}
.top .sub{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#F4B6BD}
.top a{color:#FBE3E1;font-size:13px;margin-left:14px}
.wrap{max-width:1180px;margin:0 auto;padding:28px}
.panel{background:#FFFFFF;border-radius:16px;box-shadow:0 6px 24px rgba(61,42,48,.07);padding:32px;max-width:420px;margin:40px auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;font-size:14px}
.field input,.field select,.field textarea{padding:10px 14px;border:1px solid #F4B6BD;border-radius:10px;background:#FFFCFC}
.field textarea{resize:vertical}
.field.wide{grid-column:1 / -1}
.btn{padding:11px 22px;border-radius:999px;border:1px solid #A8456A;background:#A8456A;color:#FBF8F3;cursor:pointer;font-size:14px;letter-spacing:.04em;display:inline-block}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:#3D2A30;border-color:#F4B6BD}
.btn.danger{background:transparent;color:#8E3758;border-color:#8E3758}
.btn.small{padding:7px 14px;font-size:13px}
.file-btn{position:relative}
.file-btn input{display:none}
.notice{margin:14px 0;padding:12px 16px;border-radius:10px;background:#FBE3E1;color:#8E3758;font-size:14px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:999px;border:1px solid #F9D0D4;background:#FFFFFF;cursor:pointer;font-size:13px}
.tab.on{background:#F9D0D4}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.filters select{padding:8px 12px;border:1px solid #F4B6BD;border-radius:10px;background:#FFFCFC}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;font-size:13px}
.stat{background:#FFFFFF;border-radius:12px;padding:8px 14px;box-shadow:0 2px 10px rgba(61,42,48,.06)}
.group{margin-bottom:34px}
.group h2{font-size:28px;margin-bottom:12px}
.group h2 span{font-family:'Jost',sans-serif;font-size:14px;color:#8A7568;margin-left:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:#FFFFFF;border-radius:14px;box-shadow:0 4px 18px rgba(61,42,48,.07);padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{font-size:22px}
.meta{font-size:13px;color:#5C4A50}
.meta b{font-weight:500;color:#3D2A30}
.badge{font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.s-yet{background:#F8E4E4}
.s-talked{background:#E4E8F5}
.s-confirmed{background:#DDEFE0}
.s-follow{background:#FBE7C6}
.s-completed{background:#E8E0F0}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.card-actions select{padding:7px 10px;border:1px solid #F4B6BD;border-radius:10px;background:#FFFCFC;font-size:13px}
.pick{display:flex;align-items:center;gap:6px;font-size:13px;color:#8A7568}
.notes-row{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13px;color:#5C4A50}
.notes-row textarea{padding:8px 10px;border:1px solid #F4B6BD;border-radius:10px;background:#FFFCFC;font-size:13px;resize:vertical;width:100%}
.notes-row .btn{align-self:flex-start}
.overlay{position:fixed;inset:0;background:rgba(61,42,48,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;z-index:50}
.sheet{background:#FBF8F3;border-radius:18px;max-width:760px;width:100%;padding:32px 36px;position:relative}
.x{position:absolute;top:12px;right:16px;font-size:26px;background:none;border:none;cursor:pointer}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#A8456A}
dl{display:grid;grid-template-columns:180px 1fr;gap:10px 16px;margin:18px 0}
dt{color:#8A7568;font-size:13px}
dd{margin:0;font-size:15px;white-space:pre-wrap;word-break:break-word}
.status-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.status-row .btn.on{background:#3D2A30;border-color:#3D2A30}
.section-title{font-size:24px;margin:28px 0 6px}
.hint{font-size:13px;color:#8A7568;margin:4px 0 10px}
.order-form{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
.order-form .btn{justify-self:start;margin-top:4px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:8px 0 14px}
.thumb{background:#FFFFFF;border-radius:12px;padding:8px;box-shadow:0 2px 10px rgba(61,42,48,.06);font-size:12px;display:flex;flex-direction:column;gap:6px;word-break:break-word}
.thumb img{width:100%;height:120px;object-fit:cover;border-radius:8px;background:#F8E4E4}
.pdf-tile{height:120px;border-radius:8px;background:#F8E4E4;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;color:#8E3758}
.thumb-actions{display:flex;gap:6px;flex-wrap:wrap}
.thumb-actions .btn{padding:5px 10px;font-size:12px}
.modal-note{margin-bottom:14px}
.empty{padding:40px;text-align:center;color:#8A7568}
@media (max-width:640px){dl{grid-template-columns:1fr}.sheet{padding:24px}.order-form{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="sub">Admin</div>
    <h1>Enquiries &amp; orders</h1>
  </div>
  <div>
    <a href="index.html">View website</a>
    <button id="logout-btn" class="btn ghost small hidden" type="button" style="margin-left:14px">Log out</button>
  </div>
</header>

<main class="wrap">

  <!-- Login -->
  <section id="login-view" class="panel">
    <h2 style="font-size:30px">Admin log in</h2>
    <p style="font-size:14px;margin:8px 0 22px">Only the business owner can view enquiries and orders.</p>
    <form id="login-form" autocomplete="on">
      <label class="field"><span>Username</span><input id="username" name="username" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <div id="login-error" class="notice hidden"></div>
      <button id="login-btn" class="btn" type="submit">Log in</button>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="dash-view" class="hidden">
    <div class="toolbar">
      <div class="tabs">
        <button id="view-enq" class="tab on" type="button">Enquiries</button>
        <button id="view-ord" class="tab" type="button">Confirmed orders (0)</button>
      </div>
      <button id="refresh-btn" class="btn ghost small" type="button">Refresh</button>
    </div>
    <div id="notice" class="notice hidden"></div>

    <!-- Enquiries -->
    <div id="enq-view">
      <div class="toolbar">
        <div id="tabs" class="tabs"></div>
        <div class="filters">
          <label>Status
            <select id="status-filter">
              <option value="All">All</option>
              <option>Yet to talk</option>
              <option>Talked</option>
              <option>Confirmed</option>
              <option>Need follow-up</option>
            </select>
          </label>
          <label>Sort
            <select id="sort-order">
              <option value="asc">Earliest first</option>
              <option value="desc">Latest first</option>
            </select>
          </label>
          <button id="delete-selected" class="btn danger small hidden" type="button">Delete selected (0)</button>
        </div>
      </div>
      <div id="stats" class="stats"></div>
      <div id="list"></div>
    </div>

    <!-- Confirmed orders -->
    <div id="ord-view" class="hidden">
      <div class="toolbar">
        <div class="filters">
          <label>Show
            <select id="ord-filter">
              <option value="All">All orders</option>
              <option>Confirmed</option>
              <option>Completed</option>
            </select>
          </label>
          <label>Event date
            <select id="ord-sort">
              <option value="asc">Earliest first</option>
              <option value="desc">Latest first</option>
            </select>
          </label>
        </div>
      </div>
      <div id="ord-stats" class="stats"></div>
      <div id="ord-list"></div>
    </div>
  </section>
</main>

<!-- Detail popup (enquiries and orders) -->
<div id="modal" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Details">
  <div class="sheet">
    <button class="x" type="button" aria-label="Close" id="modal-close">×</button>
    <div id="modal-note" class="notice modal-note hidden"></div>
    <div id="detail"></div>
  </div>
</div>

<script>
/* ---------- Settings ---------- */
// The same Web app URL as the enquiry form.
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5o5RJ1HdE1DYW7c7vAw--wjiFa6vPvoCB0YGMJ0T_azY1iiEnUJB-7vPyXJj2R4ORtA/exec";
var SESSION_KEY = "aarthi-admin-session";
var CATEGORIES = ["Birthday", "Baby Shower", "Anniversary", "Festival", "Corporate Event", "Community Event", "Shop Opening", "Other"];
var STATUSES = ["Yet to talk", "Talked", "Confirmed", "Need follow-up"];
var ORDER_STATUSES = ["Confirmed", "Completed"];
var PAYMENT_STATUSES = ["Unpaid", "Partly paid", "Paid"];
var MAX_UPLOAD = 5 * 1024 * 1024; // 5 MB, the same limit as the server

var state = {
  items: [], orders: [],
  view: "enq",
  tab: "All", status: "All", sort: "asc",
  orderFilter: "All", orderSort: "asc",
  selected: {},          // enquiry id -> true, for bulk delete
  current: null, currentOrder: null
};

/* ---------- Small helpers ---------- */
function $(id) { return document.getElementById(id); }

// Builds an element and sets its text safely (never innerHTML, so customer text can't run as code).
function el(tag, cls, text) {
  var node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function statusClass(s) {
  if (s === "Talked") return "s-talked";
  if (s === "Confirmed") return "s-confirmed";
  if (s === "Need follow-up") return "s-follow";
  return "s-yet";
}

function orderClass(s) { return s === "Completed" ? "s-completed" : "s-confirmed"; }

function payClass(p) {
  if (p === "Paid") return "s-confirmed";
  if (p === "Partly paid") return "s-follow";
  return "s-yet";
}

function fmtEventDate(v) {
  if (!v) return "—";
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v);
  var d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(v);
  if (isNaN(d)) return v;
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

function fmtDateTime(v) {
  var d = new Date(v);
  if (!v || isNaN(d)) return "—";
  return d.toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
}

function timeOf(item) { return new Date(item.timestamp).getTime() || 0; }

function dayOf(v) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v || "");
  return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime() : 0;
}

function field(labelText, control, wide) {
  var l = el("label", "field" + (wide ? " wide" : ""));
  l.appendChild(el("span", "", labelText));
  l.appendChild(control);
  return l;
}

function input(type, value) {
  var i = el("input");
  i.type = type;
  i.value = value || "";
  return i;
}

function select(options, value) {
  var s = el("select");
  options.forEach(function (o) {
    var op = el("option", "", o);
    op.value = o;
    if (o === value) op.selected = true;
    s.appendChild(op);
  });
  return s;
}

// Copies fresh values from the server onto a local item.
function mergeItem(item, fresh) {
  Object.keys(fresh || {}).forEach(function (k) { item[k] = fresh[k]; });
}

// Shows a message inside the popup when it is open, otherwise at the top of the page.
function alertUser(msg) {
  if (!$("modal").classList.contains("hidden")) { modalNote(msg); } else { notify(msg); }
}

function notify(msg) {
  var n = $("notice");
  if (!msg) { n.classList.add("hidden"); return; }
  n.textContent = msg;
  n.classList.remove("hidden");
}

function modalNote(msg) {
  var n = $("modal-note");
  if (!msg) { n.classList.add("hidden"); return; }
  n.textContent = msg;
  n.classList.remove("hidden");
}

/* ---------- Server calls ---------- */
// POST with a plain-text JSON body avoids a browser pre-check, so the page can read the reply.
function api(payload) {
  return fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })
    .then(function (r) { return r.json(); })
    .catch(function () { return { ok: false, error: "Could not reach the server. Check your connection and try again." }; });
}

function isLoginError(msg) { return /log in/i.test(msg || ""); }

/* ---------- Session ---------- */
function getToken() {
  try {
    var s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
    if (s && s.token && s.expires > Date.now()) return s.token;
  } catch (e) { /* ignore a damaged value */ }
  sessionStorage.removeItem(SESSION_KEY);
  return "";
}

function showLogin() {
  closeDetail();
  $("dash-view").classList.add("hidden");
  $("login-view").classList.remove("hidden");
  $("logout-btn").classList.add("hidden");
  $("password").value = "";
}

function showDashboard() {
  $("login-view").classList.add("hidden");
  $("dash-view").classList.remove("hidden");
  $("logout-btn").classList.remove("hidden");
  loadList();
}

function logout() {
  var token = getToken();
  sessionStorage.removeItem(SESSION_KEY);
  if (token) api({ action: "logout", token: token });
  state.items = [];
  state.orders = [];
  state.selected = {};
  showLogin();
}

/* ---------- Login ---------- */
$("login-form").addEventListener("submit", function (e) {
  e.preventDefault();
  var err = $("login-error");
  var btn = $("login-btn");
  err.classList.add("hidden");
  btn.disabled = true;
  btn.textContent = "Checking…";

  api({ action: "login", username: $("username").value.trim(), password: $("password").value })
    .then(function (res) {
      btn.disabled = false;
      btn.textContent = "Log in";
      $("password").value = "";
      if (!res.ok) {
        err.textContent = res.error || "Log in failed.";
        err.classList.remove("hidden");
        return;
      }
      // The session lasts a little less than the server's 6 hours, so it expires first.
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ token: res.token, expires: Date.now() + 5.5 * 3600 * 1000 }));
      showDashboard();
    });
});

$("logout-btn").addEventListener("click", logout);

/* ---------- Load (read) ---------- */
function loadList() {
  var token = getToken();
  if (!token) return logout();
  notify("");
  $("list").replaceChildren(el("div", "empty", "Loading…"));

  api({ action: "list", token: token }).then(function (res) {
    if (!res.ok) {
      // A missing or expired session means the user must log in again.
      if (isLoginError(res.error)) return logout();
      notify(res.error || "Could not load enquiries.");
      $("list").replaceChildren();
      return;
    }
    state.items = res.enquiries || [];
    state.orders = res.orders || [];
    // Forget selections for enquiries that no longer exist.
    var ids = {};
    state.items.forEach(function (i) { ids[i.id] = true; });
    Object.keys(state.selected).forEach(function (id) { if (!ids[id]) delete state.selected[id]; });
    render();
  });
}

/* ---------- Views ---------- */
function showView(v) {
  state.view = v;
  $("enq-view").classList.toggle("hidden", v !== "enq");
  $("ord-view").classList.toggle("hidden", v !== "ord");
  $("view-enq").classList.toggle("on", v === "enq");
  $("view-ord").classList.toggle("on", v === "ord");
  render();
}

function render() {
  renderTabs();
  renderStats();
  renderList();
  renderSelectionBar();
  renderOrders();
}

/* ---------- Enquiries ---------- */
function visibleItems() {
  return state.items
    .filter(function (i) { return state.tab === "All" || i.eventType === state.tab; })
    .filter(function (i) { return state.status === "All" || i.status === state.status; })
    .sort(function (a, b) {
      return state.sort === "asc" ? timeOf(a) - timeOf(b) : timeOf(b) - timeOf(a);
    });
}

function inCategory(item, cat) {
  return cat === "Other" ? CATEGORIES.indexOf(item.eventType) === -1 || item.eventType === "Other" : item.eventType === cat;
}

function renderTabs() {
  var box = $("tabs");
  box.replaceChildren();
  ["All"].concat(CATEGORIES).forEach(function (cat) {
    var count = cat === "All" ? state.items.length : state.items.filter(function (i) { return inCategory(i, cat); }).length;
    var b = el("button", "tab" + (state.tab === cat ? " on" : ""), cat + " (" + count + ")");
    b.type = "button";
    b.addEventListener("click", function () { state.tab = cat; render(); });
    box.appendChild(b);
  });
}

function renderStats() {
  var box = $("stats");
  box.replaceChildren();
  STATUSES.forEach(function (s) {
    var n = state.items.filter(function (i) { return i.status === s; }).length;
    box.appendChild(el("div", "stat " + statusClass(s), s + ": " + n));
  });
}

function renderSelectionBar() {
  var n = Object.keys(state.selected).length;
  var btn = $("delete-selected");
  btn.textContent = "Delete selected (" + n + ")";
  btn.classList.toggle("hidden", n === 0);
}

function renderList() {
  var box = $("list");
  box.replaceChildren();
  var items = visibleItems();

  if (!items.length) {
    box.appendChild(el("div", "empty", state.items.length ? "No enquiries match these filters." : "No enquiries yet."));
    return;
  }

  // "All" shows one section per event type. A single type shows one section.
  if (state.tab === "All") {
    CATEGORIES.forEach(function (cat) {
      var group = items.filter(function (i) { return inCategory(i, cat); });
      if (group.length) box.appendChild(buildGroup(cat, group));
    });
  } else {
    box.appendChild(buildGroup(state.tab, items));
  }
}

function buildGroup(title, items) {
  var g = el("section", "group");
  var h = el("h2", "", title);
  h.appendChild(el("span", "", items.length + (items.length === 1 ? " enquiry" : " enquiries")));
  g.appendChild(h);
  var cards = el("div", "cards");
  items.forEach(function (item) { cards.appendChild(buildCard(item)); });
  g.appendChild(cards);
  return g;
}

function metaLine(label, value) {
  var p = el("div", "meta");
  p.appendChild(el("b", "", label + ": "));
  p.appendChild(document.createTextNode(value || "—"));
  return p;
}

// One enquiry as a card: details, status, notes, select, view and delete.
function buildCard(item) {
  var c = el("article", "card");

  var head = el("div", "card-head");
  head.appendChild(el("h3", "", item.name || "No name"));
  head.appendChild(el("span", "badge " + statusClass(item.status), item.status));
  c.appendChild(head);

  c.appendChild(metaLine("Event date", fmtEventDate(item.date)));
  c.appendChild(metaLine("Submitted", fmtDateTime(item.timestamp)));
  c.appendChild(metaLine("Phone", item.phone));
  c.appendChild(metaLine("Budget", item.budget));
  c.appendChild(metaLine("Location", item.location));

  var actions = el("div", "card-actions");

  var pick = el("label", "pick");
  var box = el("input");
  box.type = "checkbox";
  box.checked = !!state.selected[item.id];
  box.setAttribute("aria-label", "Select this enquiry");
  box.addEventListener("change", function () {
    if (box.checked) { state.selected[item.id] = true; } else { delete state.selected[item.id]; }
    renderSelectionBar();
  });
  pick.appendChild(box);
  pick.appendChild(el("span", "", "Select"));
  actions.appendChild(pick);

  var sel = el("select");
  sel.setAttribute("aria-label", "Change status");
  STATUSES.forEach(function (s) {
    var o = el("option", "", s);
    o.value = s;
    if (s === item.status) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", function () {
    setStatus(item, sel.value, function (ok) { if (!ok) sel.value = item.status; });
  });
  actions.appendChild(sel);

  var view = el("button", "btn small", "View details");
  view.type = "button";
  view.addEventListener("click", function () { openDetail(item); });
  actions.appendChild(view);

  var del = el("button", "btn small danger", "Delete");
  del.type = "button";
  del.addEventListener("click", function () { deleteOne(item); });
  actions.appendChild(del);
  c.appendChild(actions);

  // Admin notes: saved to the same row in the Sheet.
  var notes = el("div", "notes-row");
  notes.appendChild(el("b", "", "Admin notes"));
  var ta = el("textarea");
  ta.rows = 3;
  ta.value = item.adminNotes || "";
  ta.setAttribute("aria-label", "Admin notes");
  var save = el("button", "btn small ghost", "Save notes");
  save.type = "button";
  save.addEventListener("click", function () { saveNotes(item, ta.value, save, c); });
  notes.appendChild(ta);
  notes.appendChild(save);
  c.appendChild(notes);

  return c;
}

// Replaces one card with a fresh copy of the enquiry.
function refreshCard(item, oldCard) {
  if (oldCard && oldCard.parentNode) {
    oldCard.replaceWith(buildCard(item));
  } else {
    render();
  }
}

/* ---------- Status and notes (update action) ---------- */
function setStatus(item, status, done) {
  var token = getToken();
  if (!token) return logout();
  api({ action: "update", token: token, id: item.id, status: status }).then(function (res) {
    if (!res.ok) {
      if (isLoginError(res.error)) return logout();
      alertUser(res.error || "Could not update the status.");
      if (done) done(false);
      return;
    }
    mergeItem(item, res.item);
    notify("");
    if (done) done(true);
    if (status === "Confirmed") {
      // A confirmed enquiry gets its own order, so reload to pick it up.
      loadList();
    } else {
      render();
    }
    if (state.current === item) openDetail(item);
  });
}

function saveNotes(item, notes, btn, card) {
  var token = getToken();
  if (!token) return logout();
  btn.disabled = true;
  btn.textContent = "Saving…";
  api({ action: "update", token: token, id: item.id, adminNotes: notes }).then(function (res) {
    btn.disabled = false;
    btn.textContent = "Save notes";
    if (!res.ok) {
      if (isLoginError(res.error)) return logout();
      notify(res.error || "Could not save the notes.");
      return;
    }
    mergeItem(item, res.item);
    notify("Saved notes for " + (item.name || "this enquiry") + ".");
    refreshCard(item, card);
  });
}

/* ---------- Delete ---------- */
function deleteOne(item) {
  var name = item.name || "this enquiry";
  if (!confirm("Delete enquiry from " + name + "?")) return;
  var token = getToken();
  if (!token) return logout();
  api({ action: "delete", token: token, id: item.id }).then(function (res) {
    if (!res.ok) {
      if (isLoginError(res.error)) return logout();
      notify(res.error || "Could not delete the enquiry.");
      return;
    }
    state.items = state.items.filter(function (i) { return i !== item; });
    delete state.selected[item.id];
    if (state.current === item) closeDetail();
    notify("Deleted the enquiry from " + name + ".");
    render();
  });
}

function deleteSelected() {
  var ids = Object.keys(state.selected);
  if (!ids.length) return;
  var word = ids.length === 1 ? "enquiry" : "enquiries";
  if (!confirm("Delete " + ids.length + " selected " + word + "? This cannot be undone.")) return;
  var token = getToken();
  if (!token) return logout();
  api({ action: "deleteMany", token: token, ids: ids }).then(function (res) {
    if (!res.ok) {
      if (isLoginError(res.error)) return logout();
      notify(res.error || "Could not delete the selected enquiries.");
      return;
    }
    state.items = state.items.filter(function (i) { return ids.indexOf(i.id) === -1; });
    state.selected = {};
    notify("Deleted " + ids.length + " " + word + ".");
    render();
  });
}

/* ---------- Enquiry detail popup ---------- */
function openDetail(item) {
  state.current = item;
  var d = $("detail");
  d.replaceChildren();

  d.appendChild(el("div", "eyebrow", item.eventType || "Enquiry"));
  var h = el("h2", "", item.name || "No name");
  h.style.fontSize = "34px";
  d.appendChild(h);

  var list = el("dl");
  var rows = [
    ["Submitted", fmtDateTime(item.timestamp)],
    ["Phone", item.phone],
    ["Email", item.email],
    ["Preferred contact", item.contact],
    ["Event type", item.eventType],
    ["Event date", fmtEventDate(item.date)],
    ["Location / ZIP", item.location],
    ["Theme", item.theme],
    ["Preferred colours", item.colours],
    ["Budget", item.budget],
    ["Services", item.services],
    ["Notes", item.notes],
    ["Admin notes", item.adminNotes],
    ["Consent given", item.consent],
    ["Enquiry ID", item.id]
  ];
  rows.forEach(function (r) {
    list.appendChild(el("dt", "", r[0]));
    list.appendChild(el("dd", "", r[1] || "—"));
  });
  d.appendChild(list);

  d.appendChild(el("h3", "", "Status"));
  var row = el("div", "status-row");
  STATUSES.forEach(function (s) {
    var b = el("button", "btn small" + (s === item.status ? " on" : " ghost"), s);
    b.type = "button";
    b.addEventListener("click", function () { setStatus(item, s); });
    row.appendChild(b);
  });
  d.appendChild(row);

  if (item.status === "Confirmed") {
    var linked = state.orders.filter(function (o) { return o.enquiryId === item.id; })[0];
    if (linked) {
      var go = el("button", "btn small ghost", "Open this confirmed order");
      go.type = "button";
      go.style.marginTop = "14px";
      go.addEventListener("click", function () { closeDetail(); showView("ord"); openOrder(linked); });
      d.appendChild(go);
    }
  }

  var del = el("button", "btn small danger", "Delete this enquiry");
  del.type = "button";
  del.style.marginTop = "14px";
  del.addEventListener("click", function () { deleteOne(item); });
  d.appendChild(del);

  d.appendChild(el("div", "hint", "Photos from the customer are not saved by the enquiry form yet. Once an enquiry is Confirmed, you can add your own photos and invoices in Confirmed orders."));

  modalNote("");
  $("modal").classList.remove("hidden");
}

function closeDetail() {
  $("modal").classList.add("hidden");
  state.current = null;
  state.currentOrder = null;
}

$("modal-close").addEventListener("click", closeDetail);
$("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeDetail(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDetail(); });

/* ---------- Confirmed orders ---------- */
function orderDay(o) { return dayOf(o.eventDate); }

function visibleOrders() {
  return state.orders
    .filter(function (o) { return state.orderFilter === "All" || o.orderStatus === state.orderFilter; })
    .sort(function (a, b) {
      return state.orderSort === "asc" ? orderDay(a) - orderDay(b) : orderDay(b) - orderDay(a);
    });
}

function countFiles(o, kind) {
  return (o.files || []).filter(function (f) { return f.kind === kind; }).length;
}

function renderOrders() {
  $("view-ord").textContent = "Confirmed orders (" + state.orders.length + ")";

  var stats = $("ord-stats");
  stats.replaceChildren();
  var count = function (fn) { return state.orders.filter(fn).length; };
  [
    ["Confirmed: " + count(function (o) { return o.orderStatus === "Confirmed"; }), "s-confirmed"],
    ["Completed: " + count(function (o) { return o.orderStatus === "Completed"; }), "s-completed"],
    ["Invoice sent: " + count(function (o) { return !!o.invoiceSentOn; }), "s-talked"],
    ["Paid: " + count(function (o) { return o.paymentStatus === "Paid"; }), "s-confirmed"]
  ].forEach(function (s) { stats.appendChild(el("div", "stat " + s[1], s[0])); });

  var box = $("ord-list");
  box.replaceChildren();
  var items = visibleOrders();
  if (!items.length) {
    box.appendChild(el("div", "empty", state.orders.length
      ? "No orders match this filter."
      : "No confirmed orders yet. When you set an enquiry to Confirmed, it appears here."));
    return;
  }

  if (state.orderFilter === "All") {
    [["Confirmed", "Confirmed (not completed yet)"], ["Completed", "Completed"]].forEach(function (pair) {
      var group = items.filter(function (o) { return o.orderStatus === pair[0]; });
      if (group.length) box.appendChild(buildOrderGroup(pair[1], group));
    });
  } else {
    box.appendChild(buildOrderGroup(state.orderFilter, items));
  }
}

function buildOrderGroup(title, items) {
  var g = el("section", "group");
  var h = el("h2", "", title);
  h.appendChild(el("span", "", items.length + (items.length === 1 ? " order" : " orders")));
  g.appendChild(h);
  var cards = el("div", "cards");
  items.forEach(function (o) { cards.appendChild(buildOrderCard(o)); });
  g.appendChild(cards);
  return g;
}

function buildOrderCard(o) {
  var c = el("article", "card");

  var head = el("div", "card-head");
  head.appendChild(el("h3", "", o.name || "No name"));
  head.appendChild(el("span", "badge " + orderClass(o.orderStatus), o.orderStatus || "—"));
  c.appendChild(head);

  c.appendChild(metaLine("Event", (o.eventType || "—") + " · " + fmtEventDate(o.eventDate)));
  c.appendChild(metaLine("Completed", o.completedOn ? fmtEventDate(o.completedOn) : "Not yet"));

  var inv = o.invoiceNumber ? o.invoiceNumber : "No invoice number";
  if (o.invoiceSentOn) inv += " · sent " + fmtEventDate(o.invoiceSentOn);
  else inv += " · not sent yet";
  c.appendChild(metaLine("Invoice", inv));
  c.appendChild(metaLine("Amount", o.invoiceAmount));

  var pay = el("div", "meta");
  pay.appendChild(el("b", "", "Payment: "));
  pay.appendChild(el("span", "badge " + payClass(o.paymentStatus), o.paymentStatus || "Unpaid"));
  c.appendChild(pay);

  c.appendChild(metaLine("Files", countFiles(o, "image") + " photo(s), " + countFiles(o, "invoice") + " invoice file(s)"));

  var actions = el("div", "card-actions");
  var open = el("button", "btn small", "Open order");
  open.type = "button";
  open.addEventListener("click", function () { openOrder(o); });
  actions.appendChild(open);
  c.appendChild(actions);

  return c;
}

/* ---------- Order detail popup ---------- */
function openOrder(o) {
  state.currentOrder = o;
  var d = $("detail");
  d.replaceChildren();

  d.appendChild(el("div", "eyebrow", "Order " + (o.id || "")));
  var h = el("h2", "", o.name || "No name");
  h.style.fontSize = "34px";
  d.appendChild(h);

  var list = el("dl");
  [
    ["Order status", o.orderStatus],
    ["Event type", o.eventType],
    ["Event date", fmtEventDate(o.eventDate)],
    ["Phone", o.phone],
    ["Email", o.email],
    ["Preferred contact", o.contact],
    ["Location / ZIP", o.location],
    ["Theme", o.theme],
    ["Preferred colours", o.colours],
    ["Budget", o.budget],
    ["Services", o.services],
    ["Enquiry notes", o.enquiryNotes],
    ["Enquiry ID", o.enquiryId]
  ].forEach(function (r) {
    list.appendChild(el("dt", "", r[0]));
    list.appendChild(el("dd", "", r[1] || "—"));
  });
  d.appendChild(list);

  d.appendChild(el("h3", "section-title", "Completion and invoice"));
  d.appendChild(buildOrderForm(o));

  d.appendChild(el("h3", "section-title", "Photos"));
  d.appendChild(el("p", "hint", "Venue, set-up and finished decor photos. Photos are resized automatically."));
  var photos = el("div", "files");
  photos.id = "order-photos";
  d.appendChild(photos);
  d.appendChild(uploadButton("Add photos", "image/*", true, "image"));

  d.appendChild(el("h3", "section-title", "Invoices sent"));
  d.appendChild(el("p", "hint", "A copy of each invoice you sent: a PDF, or a photo of the paper. Up to 5 MB per file."));
  var invoices = el("div", "files");
  invoices.id = "order-invoices";
  d.appendChild(invoices);
  d.appendChild(uploadButton("Add invoice", "application/pdf,image/*", true, "invoice"));

  renderOrderFiles(o);
  modalNote("");
  $("modal").classList.remove("hidden");
}

function buildOrderForm(o) {
  var f = el("form", "order-form");
  var orderStatus = select(ORDER_STATUSES, o.orderStatus || "Confirmed");
  var completedOn = input("date", o.completedOn);
  var invNo = input("text", o.invoiceNumber);
  var invDate = input("date", o.invoiceSentOn);
  var amount = input("text", o.invoiceAmount);
  amount.placeholder = "e.g. $850";
  var pay = select(PAYMENT_STATUSES, o.paymentStatus || "Unpaid");
  var notes = el("textarea");
  notes.rows = 3;
  notes.value = o.orderNotes || "";

  f.appendChild(field("Order status", orderStatus));
  f.appendChild(field("Completed on", completedOn));
  f.appendChild(field("Invoice number", invNo));
  f.appendChild(field("Invoice sent on", invDate));
  f.appendChild(field("Invoice amount", amount));
  f.appendChild(field("Payment status", pay));
  f.appendChild(field("Order notes", notes, true));

  var btn = el("button", "btn", "Save order details");
  btn.type = "submit";
  f.appendChild(btn);

  f.addEventListener("submit", function (e) {
    e.preventDefault();
    saveOrder(o, {
      orderStatus: orderStatus.value,
      completedOn: completedOn.value,
      invoiceNumber: invNo.value.trim(),
      invoiceSentOn: invDate.value,
      invoiceAmount: amount.value.trim(),
      paymentStatus: pay.value,
      orderNotes: notes.value.trim()
    }, btn);
  });
  return f;
}

function saveOrder(o, fields, btn) {
  var token = getToken();
  if (!token) return logout();
  btn.disabled = true;
  btn.textContent = "Saving…";
  api({ action: "saveOrder", token: token, id: o.id, fields: fields }).then(function (res) {
    btn.disabled = false;
    btn.textContent = "Save order details";
    if (!res.ok) {
      if (isLoginError(res.error)) return logout();
      modalNote(res.error || "Could not save the order.");
      return;
    }
    Object.keys(fields).forEach(function (k) { o[k] = fields[k]; });
    modalNote("Order details saved.");
    render();
  });
}

function uploadButton(label, accept, multiple, kind) {
  var wrap = el("label", "btn ghost small file-btn", label);
  var fileInput = el("input");
  fileInput.type = "file";
  fileInput.accept = accept;
  fileInput.multiple = multiple;
  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files.length) uploadFiles(state.currentOrder, kind, fileInput.files);
    fileInput.value = "";
  });
  wrap.appendChild(fileInput);
  return wrap;
}

function readAsDataUrl(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () { resolve(reader.result); };
    reader.onerror = function () { reject(new Error("Could not read that file.")); };
    reader.readAsDataURL(file);
  });
}

// Resizes a photo to at most 1600 px and saves it as a JPEG, so uploads stay small.
function shrinkImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error("Could not read " + file.name + ". Try saving it as a JPG or PNG."));
    };
    img.src = url;
  });
}

// Returns the file type, name and base64 data ready to send.
function prepareFile(file) {
  if (file.type === "application/pdf") {
    if (file.size > MAX_UPLOAD) return Promise.reject(new Error(file.name + " is larger than 5 MB."));
    return readAsDataUrl(file).then(function (u) {
      return { mime: "application/pdf", name: file.name, data: u.split(",")[1] };
    });
  }
  if (/^image\//.test(file.type)) {
    return shrinkImage(file).then(function (u) {
      return { mime: "image/jpeg", name: file.name.replace(/\.[^.]+$/, "") + ".jpg", data: u.split(",")[1] };
    });
  }
  return Promise.reject(new Error(file.name + ": only photos (JPG, PNG) or PDF files can be added."));
}

function uploadFiles(order, kind, fileList) {
  var token = getToken();
  if (!token) return logout();
  var files = Array.prototype.slice.call(fileList);
  var done = 0;
  var chain = Promise.resolve();
  modalNote("Uploading " + files.length + " file(s)…");

  files.forEach(function (file) {
    chain = chain.then(function () {
      return prepareFile(file).then(function (p) {
        return api({ action: "uploadFile", token: token, orderId: order.id, kind: kind, fileName: p.name, mimeType: p.mime, data: p.data });
      }).then(function (res) {
        if (!res.ok) throw new Error(res.error || "Upload failed.");
        order.files = (order.files || []).concat([res.file]);
        done++;
        renderOrderFiles(order);
      });
    });
  });

  chain.then(function () {
    modalNote(done === 1 ? "File added." : done + " files added.");
    render();
  }).catch(function (err) {
    if (isLoginError(err.message)) return logout();
    modalNote(err.message + (done ? " (" + done + " added before the error.)" : ""));
    renderOrderFiles(order);
  });
}

function renderOrderFiles(o) {
  var photosBox = $("order-photos");
  var invoicesBox = $("order-invoices");
  if (!photosBox || !invoicesBox) return;
  var files = o.files || [];
  renderFileBox(photosBox, files.filter(function (f) { return f.kind === "image"; }), o);
  renderFileBox(invoicesBox, files.filter(function (f) { return f.kind === "invoice"; }), o);
}

function renderFileBox(box, files, o) {
  box.replaceChildren();
  if (!files.length) {
    box.appendChild(el("div", "hint", "Nothing added yet."));
    return;
  }
  files.forEach(function (f) {
    var card = el("div", "thumb");
    if (/^image\//.test(f.mime || "")) {
      var img = el("img");
      img.alt = f.name || "Photo";
      card.appendChild(img);
      loadThumb(img, f);
    } else {
      card.appendChild(el("div", "pdf-tile", "PDF"));
    }
    card.appendChild(el("div", "", f.name || "File"));

    var actions = el("div", "thumb-actions");
    var open = el("button", "btn small", "Open");
    open.type = "button";
    open.addEventListener("click", function () { openFile(f); });
    var remove = el("button", "btn small ghost", "Remove");
    remove.type = "button";
    remove.addEventListener("click", function () { removeFile(o, f); });
    actions.appendChild(open);
    actions.appendChild(remove);
    card.appendChild(actions);

    box.appendChild(card);
  });
}

// Fills a photo preview from the server. Only image data URLs are accepted.
function loadThumb(img, f) {
  var token = getToken();
  if (!token) return;
  api({ action: "getFile", token: token, fileId: f.id }).then(function (res) {
    if (res.ok && /^data:image\/(jpeg|png|webp);base64,/.test(res.dataUrl || "")) {
      img.src = res.dataUrl;
    }
  });
}

function dataUrlToBlob(dataUrl) {
  var parts = dataUrl.split(",");
  var mime = /^data:([^;]+)/.exec(parts[0])[1];
  var bin = atob(parts[1]);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

function openFile(f) {
  var token = getToken();
  if (!token) return logout();
  api({ action: "getFile", token: token, fileId: f.id }).then(function (res) {
    if (!res.ok) {
      if (isLoginError(res.error)) return logout();
      modalNote(res.error || "Could not open that file.");
      return;
    }
    var url = URL.createObjectURL(dataUrlToBlob(res.dataUrl));
    var win = window.open(url, "_blank");
    if (!win) {
      // Pop-ups are blocked: download the file instead.
      var a = el("a");
      a.href = url;
      a.download = res.name || "file";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  });
}

function removeFile(order, f) {
  if (!confirm("Remove this file from the order? It will go to the Google Drive trash.")) return;
  var token = getToken();
  if (!token) return logout();
  api({ action: "deleteFile", token: token, orderId: order.id, fileId: f.id }).then(function (res) {
    if (!res.ok) {
      if (isLoginError(res.error)) return logout();
      modalNote(res.error || "Could not remove the file.");
      return;
    }
    order.files = (order.files || []).filter(function (x) { return x.id !== f.id; });
    renderOrderFiles(order);
    modalNote("File removed.");
    render();
  });
}

/* ---------- Toolbar ---------- */
$("view-enq").addEventListener("click", function () { showView("enq"); });
$("view-ord").addEventListener("click", function () { showView("ord"); });
$("status-filter").addEventListener("change", function () { state.status = this.value; render(); });
$("sort-order").addEventListener("change", function () { state.sort = this.value; render(); });
$("delete-selected").addEventListener("click", deleteSelected);
$("ord-filter").addEventListener("change", function () { state.orderFilter = this.value; render(); });
$("ord-sort").addEventListener("change", function () { state.orderSort = this.value; render(); });
$("refresh-btn").addEventListener("click", loadList);

/* ---------- Start ---------- */
if (getToken()) { showDashboard(); } else { showLogin(); }
</script>
